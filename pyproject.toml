[project]
name = "serverless-toolkit"
version = "0.1.0"
description = "Shared utilities for serverless Python applications"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
extend = "./config/ruff.toml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]